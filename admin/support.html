<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Support | Ken E-Test Admin</title><link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body data-page="admin-support"><div class="admin-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><img class="brand-logo" src="../assets/images/logo.svg" alt=""><span class="brand-text"><strong>Ken E-Test</strong><small>Admin panel</small></span></a><nav class="side-nav"><a href="dashboard.html">Dashboard</a><a href="exams.html">Examinations</a><a href="questions.html">Questions</a><a href="students.html">Students</a><a href="support.html" class="active">Student support</a><a href="results.html">Results</a><a href="results.html?tab=logs">Monitoring log</a></nav><div class="side-footer"><strong class="js-admin-name"></strong><button class="btn btn-ghost btn-sm" data-logout="admin">Log out</button></div></aside><main class="admin-main"><div class="page-head"><div><h1>Student support</h1><p>Review examination issues and send responses to students.</p></div></div><div id="pageAlert" class="alert" role="alert" hidden></div><div class="toolbar"><label for="supportStatusFilter">Filter</label><select id="supportStatusFilter"><option value="">All requests</option><option>Open</option><option>In Progress</option><option>Resolved</option></select></div><div id="adminTickets" class="ticket-list"><div class="loading-state">Loading requests...</div></div></main></div><div class="modal-overlay" id="ticketModal" hidden><div class="modal" role="dialog" aria-modal="true"><h2 id="ticketTitle">Support request</h2><div id="ticketDetails"></div><form id="ticketReplyForm"><input type="hidden" id="ticketId"><div class="field"><label for="ticketStatus">Status</label><select id="ticketStatus"><option>Open</option><option>In Progr

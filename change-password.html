<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change Password | Ken E-Test</title><link rel="icon" href="assets/images/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page" data-page="change-password"><aside class="auth-aside"><a class="brand" href="dashboard.html"><img class="brand-logo" src="assets/images/logo.svg" alt=""><span class="brand-text"><strong>Ken E-Test</strong><small>Student account</small></span></a><div><h1>Keep your examination account secure.</h1><p>Change the initial password supplied by your administrator.</p></div></aside><main class="auth-main"><div class="auth-card"><a class="back-link" href="dashboard.html">Back to dashboard</a><h2>Change password</h2><p class="subtitle">Use your current password, then choose a new password of at least 8 characters.</p><div id="formAlert" class="alert" role="alert" hidden></div><form id="passwordForm"><div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary btn-block" id="changePasswordBtn">Update password</button></form></div></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/support.js"></script></body></html>

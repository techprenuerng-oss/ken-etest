<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Examination Support | Ken E-Test</title><link rel="icon" href="assets/images/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"></head>
<body data-page="student-support"><header class="app-header"><div class="container app-header-inner"><a class="brand" href="dashboard.html"><img class="brand-logo" src="assets/images/logo.svg" alt=""><span class="brand-text"><strong>Ken E-Test</strong><small>Online Quiz and Examination System</small></span></a><nav class="app-nav"><a href="dashboard.html" class="nav-link">Dashboard</a><a href="history.html" class="nav-link">History</a><a href="support.html" class="nav-link active">Support</a></nav><div class="user-menu"><span class="user-name" id="userName"></span><button class="btn btn-secondary btn-sm" data-logout="student">Log out</button></div></div></header>
<main class="page container"><div class="page-head"><div><h1>Examination support</h1><p>Report a problem during login or an examination. The administrator will review your request.</p></div></div><div id="pageAlert" class="alert" role="alert" hidden></div><section class="card" style="max-width:760px"><h2>Submit a support request</h2><form id="supportForm"><div class="field"><label for="category">Problem category</label><select id="category" required><option value="">Select a category</option><option>Login problem</option><option>Exam not loading</option><option>Submission problem</option><option>Timer issue</option><option>Other</option></select></div><div class="field"><label for="examId">Examination (optional)</label><select id="examId"><option value="">General / not related to an exam</option></select></div><div class="field"><label for="subject">Subject</label><input id="subject" maxlength="120" required placeholder="Briefly describe the issue"></div><div class="field"><label for="message">What happened?</label><textarea id="message" rows="5" maxlength="3000" required placeholder="Describe the error and what you were doing when it happened..."></textarea></div><button class="btn btn-primary" id="sendSupportBtn">Send request</button></form></section><div class="block-title"><h2>Your support requests</h2></div><div id="ticketList" class="exam-grid"><div class="loading-state">Loading requests...</div></div></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/support.js"></script></body></html>
